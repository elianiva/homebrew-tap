name: Update the cask

# Points the cask at the newest desktop-v release of Meiro, so the version and
# checksum brew installs match what the app publishes.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Point the cask at the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_REPO: elianiva/meiro
          CASK: Casks/meiro.rb
        run: |
          set -euo pipefail
          release="$(gh api "repos/$APP_REPO/releases?per_page=100" \
            --jq '[.[] | select((.draft | not) and (.tag_name | startswith("desktop-v")))] | first')"
          test -n "$release" && test "$release" != null
          tag="$(jq -r .tag_name <<<"$release")"
          version="${tag#desktop-v}"
          asset="Meiro-${version}-macos-universal.dmg"
          url="https://github.com/$APP_REPO/releases/download/$tag/$asset"
          sha="$(jq -r --arg name "$asset" \
            '.assets[] | select(.name == $name) | .digest // ""' <<<"$release")"
          case "$sha" in
          sha256:*) sha="${sha#sha256:}" ;;
          *)
            curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/$asset"
            sha="$(sha256sum "$RUNNER_TEMP/$asset" | cut -d' ' -f1)"
            ;;
          esac
          echo "Newest release: $tag ($sha)"
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" "$CASK"
          if git diff --quiet; then
            echo "The cask already points at $tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "meiro $version"
          git push
